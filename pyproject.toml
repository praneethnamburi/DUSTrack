[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dustrack"
authors = [{name = "Praneeth Namburi", email = "praneeth.namburi@gmail.com"}]
readme = "README.md"
requires-python = ">=3.7,<=3.13"
dynamic = ["version", "description"]
dependencies = [
    "numpy<2",
    "pandas",
    "matplotlib",
    "portion",
    "ffmpeg-python",
    "tables",
    "dill",
    "tqdm",
    "scikit-image",
    "opencv-python",
    "pysampled",
    "pyfilemanager",
    "pyyaml",
    # [qt] pulls a Qt binding (PyQt6) via datanavigator's extra. DUSTrack is a
    # Qt GUI app -- even the standalone no-DLC path (GUI + LK) needs a binding,
    # so it's a hard dependency here, not opt-in as in datanavigator. qtpy
    # still picks up any pre-existing binding (e.g. PySide6 in a DLC env).
    "datanavigator[qt]>=1.5.1"
]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
keywords = ["video", "tracking", "computer-vision", "motion-analysis", "point-tracking"]

[project.scripts]
dustrack = "dustrack.cli:main"

[project.optional-dependencies]
docs = [
    "sphinx==6.2.1",
    "sphinx-rtd-theme==2.0.0",
    "myst-parser==1.0.0",
    "sphinxcontrib-youtube==1.4.1"
]
test = [
    "pytest>=7",
    "pytest-xdist>=3",
]

[project.urls]
Home = "https://github.com/praneethnamburi/DUSTrack"

[tool.flit.sdist]
exclude = ["docs/_static/dustrack_applications.mp4"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312', 'py313']

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests needing the M: corpus and/or a real deeplabcut install (auto-skipped where unavailable, e.g. CI)",
]
# Default: parallel via pytest-xdist (declared in the ``test`` extra).
# Serial debugging: ``pytest -n0``. Disable parallelism entirely with
# ``pytest -p no:xdist`` if xdist output ordering gets in the way.
addopts = "-ra --strict-markers -n auto"
