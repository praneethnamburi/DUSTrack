[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "DUSTrack"
authors = [{name = "Praneeth Namburi", email = "praneeth.namburi@gmail.com"}]
readme = "README.md"
requires-python = ">=3.7,<=3.13"
dynamic = ["version", "description"]
dependencies = [
    "numpy<2",
    "pandas",
    "matplotlib",
    "portion",
    "ffmpeg-python",
    "pytables",
    "dill",
    "tqdm",
    "scikit-image",
    "opencv-python",
    "pysampled",
    "decord",
    "pyfilemanager",
    "datanavigator>=1.1.3"
]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
keywords = ["video", "tracking", "computer-vision", "motion-analysis", "point-tracking"]

[project.optional-dependencies]
docs = [
    "sphinx==6.2.1",
    "sphinx-rtd-theme==2.0.0",
    "myst-parser==1.0.0",
    "sphinxcontrib-youtube==1.4.1"
]

[project.urls]
Home = "https://github.com/praneethnamburi/DUSTrack"

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312', 'py313']
