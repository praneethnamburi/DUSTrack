name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    env:
      # Headless: matplotlib on Agg, Qt on the offscreen platform plugin so
      # qtpy-touching tests run without a display. (offscreen is more stable
      # than xcb-under-xvfb under xdist parallelism -- xcb crashes workers.)
      # deeplabcut is deliberately NOT installed -- DLC tests skip via HAS_DLC.
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Ubuntu's apt ffmpeg lacks libx265 monochrome, so convert_to_mono
      # (h265 gray output) fails on it. Use a static build that has it.
      - name: Install ffmpeg (Linux, static build with libx265 monochrome)
        if: runner.os == 'Linux'
        run: |
          url=https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          # johnvansickle.com intermittently serves a rate-limit/error page
          # with a 200, which -sL saves and tar then rejects with a cryptic
          # "not a tar archive". Retry, and validate the body is really xz
          # before extracting, so a bad response is ridden out or fails loud.
          for i in 1 2 3 4 5; do
            curl -fL --retry 3 --retry-delay 3 --retry-all-errors "$url" -o /tmp/ff.tar.xz \
              && file /tmp/ff.tar.xz | grep -q 'XZ compressed' && break
            echo "attempt $i: ffmpeg download not an xz archive, retrying..."
            file /tmp/ff.tar.xz 2>/dev/null || true
            sleep 10
          done
          file /tmp/ff.tar.xz | grep -q 'XZ compressed' \
            || { echo "::error::ffmpeg static build could not be fetched"; head -c 300 /tmp/ff.tar.xz; exit 1; }
          mkdir -p /tmp/ffbin
          tar -xf /tmp/ff.tar.xz -C /tmp/ffbin --strip-components=1
          /tmp/ffbin/ffmpeg -hide_banner -version | head -1
          echo "/tmp/ffbin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ffmpeg --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Linux Qt (offscreen) system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dustrack (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          # datanavigator[qt] (a dustrack dependency) pulls qtpy + PyQt6; the
          # [test] extra pulls pytest + pytest-xdist. Installing only ".[test]"
          # here also validates that a clean install is GUI-capable.
          python -m pip install --editable ".[test]"

      - name: Show installed package versions
        run: python -m pip list

      # Retry once: PyQt6 under offscreen very occasionally segfaults a worker
      # under xdist (seen ~1/9 jobs, not reproducible locally). A real failure
      # fails both attempts; the retry only absorbs the rare infra flake.
      - name: Run pytest
        shell: bash
        run: |
          python -m pytest tests/ -q || {
            echo "::warning::pytest failed; retrying once to absorb a possible PyQt6-offscreen worker segfault"
            python -m pytest tests/ -q
          }
