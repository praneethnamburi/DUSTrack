name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    env:
      # Headless: matplotlib on Agg, Qt on the offscreen platform plugin so
      # qtpy-touching tests run without a display. deeplabcut is deliberately
      # NOT installed -- DLC-dependent tests skip via HAS_DLC.
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ffmpeg --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Linux Qt/xcb system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dustrack (editable) + test + Qt deps
        run: |
          python -m pip install --upgrade pip
          # qtpy + a Qt binding aren't declared deps but the suite's
          # modal/overlay tests import them lazily; provide them for CI.
          python -m pip install --editable ".[test]" qtpy PyQt6
          python -m pip install pytest-xdist

      - name: Show installed package versions
        run: python -m pip list

      - name: Run pytest
        run: python -m pytest tests/ -q
